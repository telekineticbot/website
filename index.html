<style>
  :root { color-scheme: light; --ink: #14140f; --accent: #ff7122; --mono: 'JetBrains Mono', monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #c7c8c1; color: var(--ink); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: var(--ink); }
  .hero { position: relative; min-height: 100vh; overflow: hidden; display: flex; align-items: center; }
  .hero-visual { display: contents; }
  .hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; mask-image: linear-gradient(to right, #000 42%, rgba(0,0,0,.38) 62%, rgba(0,0,0,.12) 78%, transparent 94%); }
  .product { position: relative; flex: 1; min-width: 0; max-width: 760px; margin: 0 4vw 0 48vw; padding: 64px 0; }
  h1 { font-size: clamp(48px, 6vw, 84px); font-weight: 700; line-height: 1; letter-spacing: -.025em; margin: 0 0 36px; }
  .product-name { font-size: 20px; font-weight: 600; letter-spacing: .02em; margin: 0 0 28px; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; list-style: none; font-family: var(--mono); font-size: 12px; line-height: 1.6; margin: 12px 0 0; }
  .specs li { white-space: nowrap; }
  .specs li + li { border-left: 1px solid #14140f40; padding-left: 14px; }
  h1 span { display: block; white-space: nowrap; }
  .purchase { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 20px 0 0; font-family: var(--mono); font-size: 14px; }
  .price, .availability { font: inherit; }
  .signup { width: 100%; max-width: 440px; }
  form { display: flex; width: 100%; border: 1px solid #14140f80; background: #ffffff0d; }
  input { width: 0; flex: 1; min-width: 0; padding: 12px 14px; background: transparent; color: var(--ink); border: 0; border-radius: 0; font-family: var(--mono); font-size: 14px; }
  input::placeholder { color: #14140fb3; opacity: 1; }
  button { border: 0; border-left: 1px solid #14140f80; padding: 12px 20px; background: var(--accent); color: var(--ink); font: 700 14px 'Manrope', sans-serif; cursor: pointer; transition: background .2s; white-space: nowrap; }
  button:hover { background: #ff8c4b; }
  button:disabled { cursor: wait; opacity: .7; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  input:focus-visible { outline-offset: -4px; }
  .form-message { min-height: 1.6em; margin: 10px 0 0; font-family: var(--mono); font-size: 11px; line-height: 1.6; }
  .footer { position: absolute; bottom: 30px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: end; gap: 24px; font-family: var(--mono); font-size: 10px; line-height: 1.8; color: #14140fb3; }
  .footer p { margin: 0; }
  .footer-note { text-align: right; }
  @media (max-width: 820px) {
    body { background: #c2c2bb; }
    .hero { display: block; min-height: 0; }
    .hero-photo { position: relative; display: block; inset: auto; width: 100%; height: auto; transform: none; mask-image: none; }
    .product { width: auto; max-width: none; margin: 0; padding: 28px 24px 48px; }
    h1 { font-size: 40px; margin-bottom: 28px; }
    .specs, .signup { max-width: none; }
    .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin-top: 24px; }
    .specs li { width: auto; }
    .specs li + li { border-left: 0; padding-left: 0; }
    .footer { position: relative; left: auto; right: auto; bottom: auto; padding: 0 26px 24px; font-size: 9px; }
    .footer-note { max-width: 130px; }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main class="hero">
  <picture class="hero-visual">
    <source media="(max-width: 820px)" srcset="assets/robot-studio-mobile.png" width="1122" height="1402">
  <img class="hero-photo" src="assets/robot-studio.png" alt="A white Telekinetic robot with two polished metal arms and a mobile base in a softly lit gray studio" fetchpriority="high" width="1536" height="1024">
  </picture>
  <section class="product" aria-labelledby="headline">
    <p class="product-name">Telekinetic</p>
    <h1 id="headline"><span>Teach your</span><span>own robot.</span></h1>
    <div id="tk-signup" class="signup">
      <form id="tk-form" novalidate aria-label="Get notified about Telekinetic">
        <input id="tk-email" type="email" name="email" autocomplete="email" placeholder="Enter your email" aria-label="Email address" aria-describedby="tk-error" required>
        <button id="tk-submit" type="submit">Notify me</button>
      </form>
      <p id="tk-error" class="form-message" role="alert"></p>
    </div>
    <div class="purchase"><span class="price">$2,999</span><span aria-hidden="true">·</span><span class="availability">shipping early December 2026</span></div>
    <ul class="specs" aria-label="Robot specifications"><li>Two arms</li><li>Mobile base</li><li>5 kg payload</li><li>650 mm reach</li></ul>
  </section>
  <footer class="footer">
    <p>Designed & manufactured<br>in San Francisco.</p>
    <p class="footer-note">With love,<br>by ex-Apple engineers.</p>
  </footer>
</main>
<script>
  // Email signup wired to Loops
  const LOOPS_FORM_ID = "cmqjtqvul09p20j1ea906orra";

  const signup = document.getElementById("tk-signup");
  const form = document.getElementById("tk-form");
  const emailInput = document.getElementById("tk-email");
  const submitBtn = document.getElementById("tk-submit");
  const errorEl = document.getElementById("tk-error");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = emailInput.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorEl.textContent = "Please enter a valid email.";
      return;
    }
    errorEl.textContent = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "…";
    try {
      const res = await fetch("https://app.loops.so/api/newsletter-form/" + LOOPS_FORM_ID, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ email }).toString(),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data && data.success !== false) {
        const success = document.createElement("p");
        success.style.cssText = "font-family:'JetBrains Mono',monospace; font-size:13px; margin:0;";
        success.textContent = "You're on the list. Watch your inbox.";
        success.setAttribute("role", "status");
        signup.replaceWith(success);
      } else {
        throw new Error("err");
      }
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Notify me";
      errorEl.textContent = "Couldn't sign you up. Please try again.";
    }
  });

</script>
</body>
</html>
